<!DOCTYPE html>
<html>
<body>
  <h3>Monitoramento</h3>
  <div id="estado" style="padding:8px;margin-bottom:8px;background:#888;color:#fff;font-weight:bold;">
    Aguardando login
  </div>
  <div id="login">
    <input id="senha" type="password" placeholder="Senha" size="25">
    <button id="entrar">Entrar</button>
    <br>
    <label><input type="checkbox" id="lembrar"> Lembrar senha neste aparelho</label>
  </div>
  <video id="v" autoplay muted playsinline controls width="400"></video>
  <br>
  <button id="alt" style="display:none;font-size:18px;padding:12px 20px;">Alternar câmera</button>
  <button id="lan" style="display:none;font-size:18px;padding:12px 20px;">Lanterna: desligada</button>
  <button id="esq" style="display:none;font-size:14px;padding:8px 12px;">Esquecer senha</button>
  <button id="atu" style="font-size:16px;padding:10px 16px;">Atualizar</button>
  <p id="s">Iniciando...</p>

  <div id="mov" style="display:none;margin:8px 0;padding:8px;border:1px solid #ccc;">
    <button id="movBtn" style="font-size:16px;padding:10px 16px;">Movimento: desligado</button>
    <br>
    <label>Sensibilidade: <input type="range" id="sens" min="1" max="10" value="5"></label>
    <p id="movInfo" style="margin:6px 0;"></p>
    <canvas id="foto" width="320" height="240" style="display:none;max-width:100%;"></canvas>
    <ol id="movLista" style="font-size:13px;"></ol>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    const ID = "cam-k8x2m9qw7trz4plv3nb6";
    const CHAVE = "3a0ebc7cce29d7b522e7a00fd6ecd881b510d1ab05f44ec066a8090da2b79e01";    // nome da gaveta onde a senha salva fica guardada
    const CHAVE_SENS = "movimento-sensibilidade";
    const TEMPO_LIMITE = 10000;      // sem ping por 10s = câmera offline
    const INTERVALO_RETRY = 5000;    // tenta reconectar a cada 5s
    const SALTO_TELA = 6000;         // página parada por mais de 6s = tela esteve apagada
    const TEMPO_CONEXAO = 15000;     // câmera não respondeu em 15s = tenta de novo
    const TEMPO_VIDEO = 12000;       // vídeo não chegou em 12s = tenta de novo

    function lerSenha()    { try { return localStorage.getItem(CHAVE); } catch (e) { return null; } }
    function salvarSenha(x){ try { localStorage.setItem(CHAVE, x); } catch (e) {} }
    function apagarSenha() { try { localStorage.removeItem(CHAVE); } catch (e) {} }

    function mostrarEstado(texto, cor) {
      estado.textContent = texto;
      estado.style.background = cor;
    }

    const peer = new Peer();
    let pronto = false;
    let conn = null;
    let call = null;
    let senhaAtual = null;   // senha digitada nesta sessão (usada para reconectar)
    let conectado = false;
    let tentando = false;
    let recebeuVideo = false;
    let ultimoPing = 0;
    let timerRetry = null;
    let timerVoltar = null;
    let timerConexao = null;
    let timerVideo = null;
    let tentativas = 0;

    // Pausa a detecção de movimento por alguns segundos (a imagem muda sozinha em certas ações)
    let ignorarAte = 0;
    let anterior = null;
    function pausarMovimento(ms) {
      ignorarAte = Date.now() + ms;
      anterior = null;
    }

    function agendarRetry() {
      if (timerRetry || !senhaAtual) return;
      timerRetry = setTimeout(() => {
        timerRetry = null;
        tentativas++;
        conectar();
      }, INTERVALO_RETRY);
    }

    function ficouOffline() {
      const eraOnline = conectado;
      conectado = false;
      tentando = false;
      clearTimeout(timerConexao);
      clearTimeout(timerVideo);

      const c = conn, k = call;
      conn = null;
      call = null;
      try { if (k) k.close(); } catch (e) {}
      try { if (c) c.close(); } catch (e) {}

      v.srcObject = null;  // some a imagem congelada
      mostrarEstado("● Câmera offline", "#c62828");
      s.textContent = "Câmera offline. Tentativas de reconexão: " + tentativas;
      if (eraOnline && navigator.vibrate) {
        try { navigator.vibrate([300, 150, 300]); } catch (e) {}
      }
      agendarRetry();
    }

    function iniciarVideo() {
      clearTimeout(timerConexao);
      tentativas = 0;
      conectado = true;
      tentando = false;
      recebeuVideo = false;
      ultimoPing = Date.now();
      pausarMovimento(3000);

      if (lembrar.checked) { salvarSenha(senhaAtual); esq.style.display = "inline-block"; }
      else apagarSenha();

      login.style.display = "none";
      alt.style.display = "inline-block";
      lan.style.display = "inline-block";
      mov.style.display = "block";
      mostrarEstado("● Câmera online", "#2e7d32");
      s.textContent = "Chamando a câmera...";

      const vazio = document.createElement("canvas").captureStream();
      const k = peer.call(ID, vazio);
      call = k;

      // Se o vídeo não chegar a tempo, tenta de novo
      clearTimeout(timerVideo);
      timerVideo = setTimeout(() => {
        if (call === k && !recebeuVideo) reconectarAgora();
      }, TEMPO_VIDEO);

      k.on("stream", remoto => {
        recebeuVideo = true;
        clearTimeout(timerVideo);
        v.srcObject = remoto;
        v.play().catch(() => {});
        s.textContent = "Recebendo vídeo!";
      });
      k.on("close", () => { if (call === k) ficouOffline(); });
    }

    function conectar() {
      if (!senhaAtual || tentando || conectado || !pronto) return;
      tentando = true;
      mostrarEstado("Conectando à câmera...", "#ef6c00");
      s.textContent = "Verificando senha...";

      // Se a câmera não responder a tempo, desiste e tenta de novo
      clearTimeout(timerConexao);
      timerConexao = setTimeout(() => {
        if (tentando && !conectado) ficouOffline();
      }, TEMPO_CONEXAO);

      const c = peer.connect(ID);
      conn = c;
      c.on("open", () => c.send({ tipo: "senha", valor: senhaAtual }));
      c.on("data", msg => {
        if (!msg) return;
        if (msg.tipo === "ping") { ultimoPing = Date.now(); return; }

        if (msg.tipo === "lanterna") {
          lan.textContent = msg.ligada ? "Lanterna: ligada" : "Lanterna: desligada";
          pausarMovimento(3000);   // a luz muda a imagem inteira
          if (msg.erro) s.textContent = msg.erro;
          return;
        }

        if (msg.tipo === "resultado") {
          if (msg.ok) {
            iniciarVideo();
          } else {
            clearTimeout(timerConexao);
            senhaAtual = null;
            tentando = false;
            apagarSenha();
            login.style.display = "block";
            mostrarEstado("Senha incorreta", "#c62828");
            s.textContent = "Senha incorreta.";
          }
        }
      });
      c.on("close", () => { if (conn === c) ficouOffline(); });
    }

    // Derruba o que estiver aberto e tenta de novo (botão Atualizar e volta da tela)
    function reconectarAgora() {
      clearTimeout(timerRetry);
      clearTimeout(timerConexao);
      clearTimeout(timerVideo);
      timerRetry = null;
      const c = conn, k = call;
      conn = null;
      call = null;
      try { if (k) k.close(); } catch (e) {}
      try { if (c) c.close(); } catch (e) {}
      conectado = false;
      tentando = false;
      v.srcObject = null;

      // Sem senha digitada nesta sessão, o jeito é recarregar a página
      if (!senhaAtual || peer.destroyed) { location.reload(); return; }

      s.textContent = "Atualizando...";
      mostrarEstado("Conectando à câmera...", "#ef6c00");
      if (peer.disconnected) peer.reconnect();
      setTimeout(conectar, 1000);
    }

    // A tela voltou (ou a rede voltou): confere se ainda está tudo vivo
    function aoVoltar() {
      if (!senhaAtual || timerVoltar) return;   // sem login ainda, ou já verificando
      mostrarEstado("Verificando conexão...", "#ef6c00");
      timerVoltar = setTimeout(() => {
        timerVoltar = null;
        const vivo = conectado && (Date.now() - ultimoPing < 5000);
        if (vivo) {
          mostrarEstado("● Câmera online", "#2e7d32");
        } else {
          reconectarAgora();
        }
      }, 1500);
    }

    // Eventos de volta da tela/rede
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") aoVoltar();
    });
    window.addEventListener("focus", aoVoltar);
    window.addEventListener("pageshow", aoVoltar);
    window.addEventListener("online", aoVoltar);

    // Vigia: ping da câmera + detector de "página congelada"
    let ultimoTick = Date.now();
    setInterval(() => {
      const agora = Date.now();
      const parada = agora - ultimoTick;
      ultimoTick = agora;

      if (parada > SALTO_TELA) {   // a página ficou suspensa: provavelmente tela apagada
        aoVoltar();
        return;
      }
      if (conectado && agora - ultimoPing > TEMPO_LIMITE) ficouOffline();
    }, 2000);

    // ================= Detecção de movimento =================
    // Feita aqui, analisando o vídeo recebido. Só funciona com esta página aberta.
    const LARG = 64, ALT = 48;               // imagem pequena para analisar rápido
    const pequeno = document.createElement("canvas");
    pequeno.width = LARG;
    pequeno.height = ALT;
    const ctxP = pequeno.getContext("2d", { willReadFrequently: true });

    const COOLDOWN = 8000;                   // 8s entre alertas
    let movAtivo = false;
    let ultimoAlerta = 0;
    let audioCtx = null;
    const historico = [];

    try {
      const guardada = localStorage.getItem(CHAVE_SENS);
      if (guardada) sens.value = guardada;
    } catch (e) {}
    sens.onchange = () => {
      try { localStorage.setItem(CHAVE_SENS, sens.value); } catch (e) {}
    };

    // Sensibilidade 1..10: quanto maior, mais sensível
    function limiares() {
      const n = Number(sens.value);
      return {
        pixel: 38 - 2.5 * n,        // diferença mínima de brilho por ponto
        fracao: 0.06 - 0.005 * n    // fração mínima de pontos que mudaram
      };
    }

    function apitar() {
      try {
        if (!audioCtx) return;
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = "sine";
        o.frequency.value = 880;
        g.gain.value = 0.2;
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start();
        o.stop(audioCtx.currentTime + 0.4);
      } catch (e) {}
    }

    function detectou(proporcao) {
      const agora = Date.now();
      if (agora - ultimoAlerta < COOLDOWN) return;
      ultimoAlerta = agora;
      const hora = new Date().toLocaleTimeString("pt-BR");

      // Foto do momento
      try {
        const w = foto.width;
        foto.height = Math.round(w * v.videoHeight / v.videoWidth);
        foto.getContext("2d").drawImage(v, 0, 0, w, foto.height);
        foto.style.display = "block";
      } catch (e) {}

      historico.unshift(hora + " (variação " + (proporcao * 100).toFixed(1) + "%)");
      if (historico.length > 5) historico.length = 5;
      movLista.innerHTML = historico.map(x => "<li>" + x + "</li>").join("");

      mostrarEstado("⚠ Movimento detectado às " + hora, "#ef6c00");
      s.textContent = "Movimento detectado às " + hora;
      setTimeout(() => { if (conectado) mostrarEstado("● Câmera online", "#2e7d32"); }, 4000);

      if (navigator.vibrate) {
        try { navigator.vibrate([200, 100, 200]); } catch (e) {}
      }
      apitar();
    }

    function analisarMovimento() {
      if (!movAtivo || !conectado || !recebeuVideo) { anterior = null; return; }
      if (v.readyState < 2 || !v.videoWidth) return;
      if (Date.now() < ignorarAte) { anterior = null; return; }

      let dados;
      try {
        ctxP.drawImage(v, 0, 0, LARG, ALT);
        dados = ctxP.getImageData(0, 0, LARG, ALT).data;
      } catch (e) {
        movInfo.textContent = "Não foi possível analisar o vídeo: " + e.message;
        return;
      }

      const cinza = new Uint8Array(LARG * ALT);
      for (let i = 0, j = 0; i < dados.length; i += 4, j++) {
        cinza[j] = dados[i] * 0.3 + dados[i + 1] * 0.59 + dados[i + 2] * 0.11;
      }

      if (anterior) {
        const lim = limiares();
        let mudou = 0;
        for (let j = 0; j < cinza.length; j++) {
          if (Math.abs(cinza[j] - anterior[j]) > lim.pixel) mudou++;
        }
        const proporcao = mudou / cinza.length;
        movInfo.textContent = "Variação atual: " + (proporcao * 100).toFixed(1) + "%";
        if (proporcao > lim.fracao) detectou(proporcao);
      }
      anterior = cinza;
    }
    setInterval(analisarMovimento, 500);

    movBtn.onclick = () => {
      movAtivo = !movAtivo;
      movBtn.textContent = movAtivo ? "Movimento: ligado" : "Movimento: desligado";
      anterior = null;
      if (movAtivo) {
        // O som só é liberado depois de um toque do usuário, como este
        try {
          audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === "suspended") audioCtx.resume();
        } catch (e) {}
        movInfo.textContent = "Calibrando...";
        pausarMovimento(1500);
      } else {
        movInfo.textContent = "";
      }
    };
    // =========================================================

    peer.on("open", () => {
      pronto = true;
      const salva = lerSenha();
      if (salva) {
        senha.value = salva;
        lembrar.checked = true;
        entrar.click();
      } else {
        s.textContent = "Digite a senha.";
      }
    });

    peer.on("disconnected", () => peer.reconnect());

    peer.on("error", e => {
      if (e.type === "peer-unavailable") {
        ficouOffline();        // câmera não está registrada no servidor
      } else {
        s.textContent = "Erro do Peer: " + e.type;
      }
    });

    entrar.onclick = () => {
      if (!pronto) { s.textContent = "Aguarde a conexão..."; return; }
      senhaAtual = senha.value;
      tentando = false;
      conectar();
    };

    alt.onclick = () => {
      pausarMovimento(3000);   // a imagem muda por completo ao trocar de câmera
      if (conn && conn.open) conn.send({ tipo: "alternar" });
    };

    lan.onclick = () => {
      pausarMovimento(3000);
      if (conn && conn.open) conn.send({ tipo: "lanterna" });
    };

    esq.onclick = () => {
      apagarSenha();
      location.reload();
    };

    atu.onclick = reconectarAgora;
  </script>
</body>
</html>
