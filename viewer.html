<!DOCTYPE html>
<html>
<body>
  <h3>Monitoramento</h3>
  <div id="estado" style="padding:8px;margin-bottom:8px;background:#888;color:#fff;font-weight:bold;">
    Aguardando login
  </div>
  <div id="login">
    <input id="senha" type="password" placeholder="Senha" size="25">
    <button id="entrar">Entrar</button>
    <br>
    <label><input type="checkbox" id="lembrar"> Lembrar senha neste aparelho</label>
  </div>
  <video id="v" autoplay muted playsinline controls width="400"></video>
  <br>
  <button id="alt" style="display:none;font-size:18px;padding:12px 20px;">Alternar câmera</button>
  <button id="esq" style="display:none;font-size:14px;padding:8px 12px;">Esquecer senha</button>
  <button id="atu" style="font-size:16px;padding:10px 16px;">Atualizar</button>
  <p id="s">Iniciando...</p>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    const ID = "cam-k8x2m9qw7trz4plv3nb6";
    const CHAVE = "3a0ebc7cce29d7b522e7a00fd6ecd881b510d1ab05f44ec066a8090da2b79e01";
    const TEMPO_LIMITE = 10000;    // sem ping por 10s = câmera offline
    const INTERVALO_RETRY = 5000;  // tenta reconectar a cada 5s

    function lerSenha()    { try { return localStorage.getItem(CHAVE); } catch (e) { return null; } }
    function salvarSenha(x){ try { localStorage.setItem(CHAVE, x); } catch (e) {} }
    function apagarSenha() { try { localStorage.removeItem(CHAVE); } catch (e) {} }

    function mostrarEstado(texto, cor) {
      estado.textContent = texto;
      estado.style.background = cor;
    }

    const peer = new Peer();
    let pronto = false;
    let conn = null;
    let call = null;
    let senhaAtual = null;   // senha digitada nesta sessão (usada para reconectar)
    let conectado = false;
    let tentando = false;
    let ultimoPing = 0;
    let timerRetry = null;
    let tentativas = 0;

    function agendarRetry() {
      if (timerRetry || !senhaAtual) return;
      timerRetry = setTimeout(() => {
        timerRetry = null;
        tentativas++;
        conectar();
      }, INTERVALO_RETRY);
    }

    function ficouOffline() {
      const eraOnline = conectado;
      conectado = false;
      tentando = false;

      const c = conn, k = call;
      conn = null;
      call = null;
      try { if (k) k.close(); } catch (e) {}
      try { if (c) c.close(); } catch (e) {}

      v.srcObject = null;  // some a imagem congelada
      mostrarEstado("● Câmera offline", "#c62828");
      s.textContent = "Câmera offline. Tentativas de reconexão: " + tentativas;
      if (eraOnline && navigator.vibrate) {
        try { navigator.vibrate([300, 150, 300]); } catch (e) {}
      }
      agendarRetry();
    }

    function iniciarVideo() {
      tentativas = 0;
      conectado = true;
      tentando = false;
      ultimoPing = Date.now();

      if (lembrar.checked) { salvarSenha(senhaAtual); esq.style.display = "inline-block"; }
      else apagarSenha();

      login.style.display = "none";
      alt.style.display = "inline-block";
      mostrarEstado("● Câmera online", "#2e7d32");
      s.textContent = "Chamando a câmera...";

      const vazio = document.createElement("canvas").captureStream();
      const k = peer.call(ID, vazio);
      call = k;
      k.on("stream", remoto => {
        v.srcObject = remoto;
        v.play().catch(() => {});
        s.textContent = "Recebendo vídeo!";
      });
      k.on("close", () => { if (call === k) ficouOffline(); });
    }

    function conectar() {
      if (!senhaAtual || tentando || conectado || !pronto) return;
      tentando = true;
      mostrarEstado("Conectando à câmera...", "#ef6c00");
      s.textContent = "Verificando senha...";

      const c = peer.connect(ID);
      conn = c;
      c.on("open", () => c.send({ tipo: "senha", valor: senhaAtual }));
      c.on("data", msg => {
        if (!msg) return;
        if (msg.tipo === "ping") { ultimoPing = Date.now(); return; }
        if (msg.tipo === "resultado") {
          if (msg.ok) {
            iniciarVideo();
          } else {
            senhaAtual = null;
            tentando = false;
            apagarSenha();
            login.style.display = "block";
            mostrarEstado("Senha incorreta", "#c62828");
            s.textContent = "Senha incorreta.";
          }
        }
      });
      c.on("close", () => { if (conn === c) ficouOffline(); });
    }

    // Vigia: se a câmera parar de mandar ping, está offline
    setInterval(() => {
      if (conectado && Date.now() - ultimoPing > TEMPO_LIMITE) ficouOffline();
    }, 2000);

    peer.on("open", () => {
      pronto = true;
      const salva = lerSenha();
      if (salva) {
        senha.value = salva;
        lembrar.checked = true;
        entrar.click();
      } else {
        s.textContent = "Digite a senha.";
      }
    });

    peer.on("disconnected", () => peer.reconnect());

    peer.on("error", e => {
      if (e.type === "peer-unavailable") {
        ficouOffline();        // câmera não está registrada no servidor
      } else {
        s.textContent = "Erro do Peer: " + e.type;
      }
    });

    entrar.onclick = () => {
      if (!pronto) { s.textContent = "Aguarde a conexão..."; return; }
      senhaAtual = senha.value;
      tentando = false;
      conectar();
    };

    alt.onclick = () => {
      if (conn && conn.open) conn.send({ tipo: "alternar" });
    };

    esq.onclick = () => {
      apagarSenha();
      location.reload();
    };

    atu.onclick = () => {
      // Cancela a espera por uma nova tentativa e derruba o que estiver aberto
      clearTimeout(timerRetry);
      timerRetry = null;
      const c = conn, k = call;
      conn = null;
      call = null;
      try { if (k) k.close(); } catch (e) {}
      try { if (c) c.close(); } catch (e) {}
      conectado = false;
      tentando = false;
      v.srcObject = null;

      // Sem senha digitada nesta sessão, o jeito é recarregar a página
      if (!senhaAtual || peer.destroyed) { location.reload(); return; }

      s.textContent = "Atualizando...";
      mostrarEstado("Conectando à câmera...", "#ef6c00");
      // Se perdeu o contato com o servidor do PeerJS, reconecta antes
      if (peer.disconnected) peer.reconnect();
      setTimeout(conectar, 1000);
    };
  </script>
</body>
</html>
